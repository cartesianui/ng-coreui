<!--sidebar-->
<c-sidebar #sidebar="cSidebar" class="d-print-none sidebar sidebar-fixed" colorScheme="dark" id="sidebar" visible>

<c-sidebar-header class="border-bottom">
  <c-sidebar-brand
    [brandFull]="{
      src: 'assets/img/brand/logo.svg',
      width: 170,
      alt: 'CartesianUI Logo'
    }"
    [brandNarrow]="{
      src: 'assets/img/brand/icon.svg',
      width: 40,
      alt: 'CartesianUI Icon'
    }"
    routerLink="./"
  >

  </c-sidebar-brand>
</c-sidebar-header>
  <ng-scrollbar pointerEventsMethod="scrollbar" visibility="hover">
    <c-sidebar-nav [navItems]="navItems" dropdownMode="none" compact />
  </ng-scrollbar>

  @if (!sidebar.narrow) {
    <c-sidebar-footer cSidebarToggle="sidebar" class="border-top d-none d-lg-flex" toggle="unfoldable" style="cursor: pointer;">
      <button cSidebarToggler aria-label="Toggle sidebar fold"></button>
    </c-sidebar-footer>
  }
</c-sidebar>

<!--main-->
<div class="wrapper d-flex flex-column min-vh-100 bg-light dark:bg-transparent">
  <!--app-header-->
  <app-default-header
    class="mb-4 d-print-none header header-sticky p-0 shadow-sm"
    position="sticky"
    sidebarId="sidebar"
  />
  <!--app-body-->
  <div class="body flex-grow-1 px-3">
    <c-container breakpoint="lg" class="h-auto">
      <!-- system-notification area — standalone component owns its
           own fetch + render; this is the only integration surface. -->
      <system-notifications-banner></system-notifications-banner>
      <router-outlet></router-outlet>
    </c-container>
  </div>
  <!--app footer-->
  <app-default-footer></app-default-footer>
</div>
