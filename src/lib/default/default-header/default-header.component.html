<ng-template #userDropdown>
  <c-dropdown alignment="end" variant="nav-item">
    <button cButton color="" [caret]="false" cDropdownToggle class="py-0 d-flex align-items-center gap-2">
      <c-avatar shape="rounded-1" size="md" [src]="avatarSrc()" status="success"></c-avatar>
      @if (displayName()) {
        <span class="d-none d-md-inline fw-semibold">{{ displayName() }}</span>
      }
    </button>
    <ul cDropdownMenu class="user-menu">
      <li class="user-menu-card">
        <c-avatar shape="rounded-circle" size="lg" [src]="avatarSrc()"></c-avatar>
        <div class="user-menu-card-meta">
          @if (displayName()) {
            <div class="user-menu-name">{{ displayName() }}</div>
          }
          @if (displayEmail()) {
            <div class="user-menu-email">{{ displayEmail() }}</div>
          }
        </div>
      </li>

      <li class="user-menu-section">Settings</li>

      <li>
        <a routerLink="/admin/settings/profile" cDropdownItem class="user-menu-item">
          <svg cIcon name="cilUser"></svg>
          <span>Profile</span>
        </a>
      </li>
      <li>
        <a routerLink="/admin/settings/profile" cDropdownItem class="user-menu-item">
          <svg cIcon name="cilUser"></svg>
          <span>User Settings</span>
        </a>
      </li>
      @if (canManageWorkspace()) {
        <li>
          <a routerLink="/admin/settings/tenant" cDropdownItem class="user-menu-item">
            <svg cIcon name="cilBuilding"></svg>
            <span>Tenant Settings</span>
          </a>
        </li>
        <li>
          <a routerLink="/admin/settings/domain" cDropdownItem class="user-menu-item">
            <svg cIcon name="cilGlobeAlt"></svg>
            <span>Domain Settings</span>
          </a>
        </li>
      }

      <li><hr cDropdownDivider /></li>

      <li>
        <a cDropdownItem class="user-menu-item user-menu-item-danger" (click)="logout()">
          <svg cIcon name="cilLockLocked"></svg>
          <span>Log Out</span>
        </a>
      </li>
    </ul>
  </c-dropdown>
</ng-template>
<ng-template #themeDropdown>
  <c-dropdown alignment="end" variant="nav-item">
    <button [caret]="false" cDropdownToggle aria-label="Open theme picker">
      <svg cIcon [name]="icons()" size="lg"></svg>
    </button>
    <div cDropdownMenu>
      @for (mode of colorModes; track mode.name) {
        <button (click)="colorMode.set(mode.name)" [active]="colorMode() === mode.name" cDropdownItem class="d-flex align-items-center">
          <svg cIcon class="me-2" [name]="mode.icon" size="lg"></svg>
          {{ mode.text }}
        </button>
      }
    </div>
  </c-dropdown>
</ng-template>
