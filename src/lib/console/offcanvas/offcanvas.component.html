<c-offcanvas
  [placement]="'end'"
  [backdrop]="false"
  [scroll]="false"
  [id]="id"
  [visible]="visible"
  [style.width]="width || null"
  (visibleChange)="visibleChange.emit($event)">

  <div cOffcanvasHeader class="offcanvas-header">
    <h5 cOffcanvasTitle>{{ title }}</h5>
    <button cButtonClose class="text-reset" [cOffcanvasToggle]="id" aria-label="Close"></button>
  </div>

  <div cOffcanvasBody class="offcanvas-body">
    <ng-content></ng-content>
  </div>

</c-offcanvas>
